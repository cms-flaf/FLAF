name: Test Era Dimension

on:
  workflow_call:
    inputs:
      eras:
        required: true
        type: string
        description: 'Space-separated list of the eras one run spans (at least two)'

permissions:
  contents: read

jobs:
  test-era-dimension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: cms-flaf/FLAF/.github/actions/checkout-flaf@main

      - name: Initialize FLAF submodules
        run: |
          cd FLAF
          git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ROOT and Corrections are stand-ins inside the test: no payload runs
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install pyyaml law==0.1.21 luigi==3.8.1

      - name: Every stage over all eras at once
        run: python FLAF/test/test_era_dimension.py ${{ inputs.eras }}
