name: Unit Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      # The tests import `FLAF.<package>` from the parent of the checkout, whose directory is
      # named after the repository.
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install pyyaml luigi==3.8.1 law==0.1.21 pytest

      # env.sh is sourced from bash and from zsh, and test_flaf_env.py runs it in both; the runner
      # has no zsh, and under CI a missing zsh fails those cases.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # Only the suites that need neither ROOT nor CVMFS nor a grid proxy; the CRAB and
      # remote-storage mechanics they cover run on a batch node only, where nothing else
      # would catch a regression before a production does. Named explicitly: other files in
      # test/ need ROOT, and `unittest discover -s test` would resolve `test.<module>` to
      # CPython's own `test` package.
      - name: Run the unit tests
        run: >-
          python -m pytest -q
          test/test_anatuple_cost_model.py
          test/test_atomic_publish.py
          test/test_bundle_jobs.py
          test/test_crab_credentials.py
          test/test_crab_failure_reporting.py
          test/test_crab_hardening.py
          test/test_crab_job_completeness.py
          test/test_crab_refused_submission.py
          test/test_crab_resources.py
          test/test_crab_sites.py
          test/test_crab_stageout_placeholder.py
          test/test_crab_watchdog.py
          test/test_crab_watchdog_integration.py
          test/test_crab_wave_gate.py
          test/test_check_era_rename.py
          test/test_ci_generate_matrix.py
          test/test_era_branches.py
          test/test_era_jobs.py
          test/test_era_parameter.py
          test/test_era_process_state.py
          test/test_era_requires.py
          test/test_eos_lock.py
          test/test_flaf_env.py
          test/test_fresh_negatives.py
          test/test_gfal_absent_vs_unreachable.py
          test/test_local_path_cache_server.py
          test/test_path_cache.py
          test/test_plot_groups.py
          test/test_remote_log_names.py
          test/test_submission_guards.py
          test/test_voms_proxy_info.py

      # The period -> era rename (multi-era change set): no leftover in FLAF's own files. The
      # path-cache server's periods are cache validity times, and two tests spell the old names
      # on purpose.
      - name: No leftover of the period -> era rename
        run: >-
          python3 run_tools/check_era_rename.py --repo .
          --exclude 'RunKit/pathCacheServer.py'
          --exclude 'test/test_era_parameter.py'
          --exclude 'test/test_check_era_rename.py'
