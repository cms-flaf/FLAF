# DY (single-flavor mu-mu) Vpt/NpNLO stitching with an added m_ll axis so the
# DYto2Mu_MLL_105to160 amcatnlo sample can be stitched in on top of the inclusive DY.
# Assumes the in-window cross-section fraction is Vpt/NpNLO-independent
# (f = sigma(105<m<160) / sigma(m>50) ~ 2.2%); the window sample only adds
# statistics inside the window (its events share the same per-bin cross-section).
crossSections: { }
totalCrossSectionScaling: DY_NNLO_QCD_NLO_EW / DYto2L_M_50_amcatnloFXFX_singleFlavor
bins:
  - name: NpNLO_0_mll_105_160
    selection: "(LHE_NpNLO == 0) && LHE_mll >= 105 && LHE_mll < 160"
    crossSection: (DYto2L_M_50_0J_amcatnloFXFX_singleFlavor) * (DYto2Mu_MLL_105to160_amcatnloFXFX / DYto2L_M_50_amcatnloFXFX_singleFlavor)
  - name: NpNLO_0_mll_other
    selection: "(LHE_NpNLO == 0) && !(LHE_mll >= 105 && LHE_mll < 160)"
    crossSection: (DYto2L_M_50_0J_amcatnloFXFX_singleFlavor) * (1 - (DYto2Mu_MLL_105to160_amcatnloFXFX / DYto2L_M_50_amcatnloFXFX_singleFlavor))
  - name: Vpt_0_40_NpNLO_1_mll_105_160
    selection: "(LHE_Vpt >= 0 && LHE_Vpt < 40 && LHE_NpNLO == 1) && LHE_mll >= 105 && LHE_mll < 160"
    crossSection: (DYto2L_M_50_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_40to100_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_100to200_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_200to400_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_400to600_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_600_1J_amcatnloFXFX_singleFlavor) * (DYto2Mu_MLL_105to160_amcatnloFXFX / DYto2L_M_50_amcatnloFXFX_singleFlavor)
  - name: Vpt_0_40_NpNLO_1_mll_other
    selection: "(LHE_Vpt >= 0 && LHE_Vpt < 40 && LHE_NpNLO == 1) && !(LHE_mll >= 105 && LHE_mll < 160)"
    crossSection: (DYto2L_M_50_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_40to100_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_100to200_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_200to400_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_400to600_1J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_600_1J_amcatnloFXFX_singleFlavor) * (1 - (DYto2Mu_MLL_105to160_amcatnloFXFX / DYto2L_M_50_amcatnloFXFX_singleFlavor))
  - name: Vpt_0_40_NpNLO_2_mll_105_160
    selection: "(LHE_Vpt >= 0 && LHE_Vpt < 40 && LHE_NpNLO == 2) && LHE_mll >= 105 && LHE_mll < 160"
    crossSection: (DYto2L_M_50_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_40to100_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_100to200_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_200to400_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_400to600_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_600_2J_amcatnloFXFX_singleFlavor) * (DYto2Mu_MLL_105to160_amcatnloFXFX / DYto2L_M_50_amcatnloFXFX_singleFlavor)
