    crossSection: (DYto2L_M_50_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_40to100_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_100to200_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_200to400_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_400to600_2J_amcatnloFXFX_singleFlavor - DYto2L_M_50_PTLL_600_2J_amcatnloFXFX_singleFlavor) * (1 - (DYto2Mu_MLL_105to160_amcatnloFXFX / DYto2L_M_50_amcatnloFXFX_singleFlavor))
